# Free on GitHub Actions (unlimited minutes for public repos; 2,000/month for
# private ones -- one run here is ~3-4 min). Only runs on PRs and pushes to
# main, and cancels superseded runs, to keep minutes low.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATA_MODE: mock
      AI_PROVIDER: mock
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt aiosqlite pytest
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  # Browser smoke tests: production build + mock-mode API + Redis, then
  # Playwright clicks through every page on desktop and phone sizes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATA_MODE: mock
      AI_PROVIDER: mock
      AUTO_CREATE_TABLES: "true"
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      REDIS_URL: redis://localhost:6379/0
      BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API (mock data)
        working-directory: backend
        run: |
          pip install -r requirements.txt aiosqlite
          nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/learn >/dev/null && curl -sf localhost:8000/health >/dev/null && break; sleep 2; done
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        run: tail -n 80 api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
