# Daily price history for every tracked stock (US + NSE), written to Upstash
# Redis for the API to serve. Runs here because Yahoo blocks Render's IPs.
#
# Free: public repos get unlimited Actions minutes (one run is ~1-2 min), and
# it costs ~1 Upstash command per stock per run (two runs per weekday), plus
# one for the earnings/dividend dates.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository secret
#   REDIS_URL = the same rediss://... URL the backend uses on Render.
#
# Note: GitHub pauses scheduled workflows in public repos after 60 days with no
# commits. If history goes stale, re-enable it from the Actions tab.
name: Sync price history

on:
  schedule:
    # Midday NSE-only run, so Indian stocks show a delayed intraday price
    # during the session (~70 Upstash commands a run). GitHub starts this
    # repo's scheduled runs 3.5-10.5 hours late (measured over Nov 2026), so
    # it is scheduled at 02:00 UTC to land inside the 03:45-10:00 UTC
    # session most days. Running early or late just stores the latest close.
    - cron: "0 2 * * 1-5"
    # 10:30 UTC Mon-Fri: just after the NSE close (10:00 UTC), so Indian
    # prices are the same day's close (they have no live quote source).
    - cron: "30 10 * * 1-5"
    # 22:30 UTC Mon-Fri: after the US close (20:00/21:00 UTC).
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: sync-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Latest yfinance on purpose: it's the piece that has to keep up with
      # Yahoo's changes. Only the libraries the script imports are installed.
      - run: pip install "yfinance>=0.2.50" "redis>=5"
      - name: Fetch history and write to Redis
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SYNC_MARKET: ${{ github.event.schedule == '0 2 * * 1-5' && 'IN' || 'ALL' }}
        run: python -m scripts.sync_history
      # Earnings / dividend dates for the watchlist page. Once a day is plenty
      # (they rarely change); a failure here never fails the price sync.
      - name: Fetch earnings and dividend dates
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 22 * * 1-5'
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python -m scripts.sync_events
